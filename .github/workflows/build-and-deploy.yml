name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    strategy:
      fail-fast: false # Pozwala jednemu runnerowi dokończyć wdrożenie nawet jeśli drugi napotka błąd
      matrix:
        include:
          - target-runner: "fitness-workouts-api"
            server-port: "8084"
            db-url: "jdbc:postgresql://10.10.0.2:5432/ptfitness-workouts"
            db-user: "postgres"
          - target-runner: "T460Ubuntu1"
            server-port: "8084"
            db-url: "jdbc:postgresql://localhost:5432/ptfitness-workouts"
            db-user: "postgres"

    runs-on: [ self-hosted, "${{ matrix.target-runner }}" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Identify user running the workflow
    - name: Identify User
      run: |
        echo "Running on runner: ${{ matrix.target-runner }}"
        whoami
        id

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew --stop
        ./gradlew clean build --rerun-tasks

    - name: Stop application
      run: |
        echo "Stopping application"
        sudo systemctl stop fitness-workouts-api || true

    - name: Copy Jar to /opt/fitness-workouts-api
      run: |
        echo "Copying JAR to /opt/fitness-workouts-api"
        umask 002
        JAR=build/libs/fitness-workouts-api-0.0.1-SNAPSHOT.jar
        if [ ! -f "$JAR" ]; then
          echo "Jar not found at $JAR"; exit 1
        fi
        sudo mkdir -p /opt/fitness-workouts-api
        sudo cp "$JAR" /opt/fitness-workouts-api/

    - name: Configure environment variables and systemd service
      env:
        SERVER_PORT: ${{ matrix.server-port }}
        DB_URL: ${{ matrix.db-url }}
        DB_USER: ${{ matrix.db-user }}
        DB_PASS: ${{ secrets.DB_PASSWORD }}
      run: |
        echo "Configuring environment variables and systemd service file..."
        
        # 1. Create secure environment file with runner-specific configuration
        cat << EOF > /tmp/fitness-workouts-api.env
        SERVER_PORT=$SERVER_PORT
        DB_URL=$DB_URL
        DB_USERNAME=$DB_USER
        EOF

        if [ -n "$DB_PASS" ]; then
          echo "DB_PASSWORD=$DB_PASS" >> /tmp/fitness-workouts-api.env
        fi

        sudo mv /tmp/fitness-workouts-api.env /opt/fitness-workouts-api/fitness-workouts-api.env
        sudo chmod 600 /opt/fitness-workouts-api/fitness-workouts-api.env

        # 2. Configure and install systemd service
        CURRENT_USER=$(whoami)
        cp deployment/fitness-workouts-api.service /tmp/fitness-workouts-api.service
        sed -i "s/USER_PLACEHOLDER/$CURRENT_USER/g" /tmp/fitness-workouts-api.service
        sudo mv /tmp/fitness-workouts-api.service /etc/systemd/system/fitness-workouts-api.service
        sudo systemctl daemon-reload

    - name: Start application
      run: |
        echo "Starting application"
        sudo systemctl start fitness-workouts-api
